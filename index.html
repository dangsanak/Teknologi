<!DOCTYPE html>
<html hreflang="x-default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teknologi,Seo & Fashion Blog</title>
    <style>
        /* CSS Variabel untuk Tema Default (Siang/Light) */
        :root {
            --bg-color: #fff0f5;
            --header-bg: #ff69b4;
            --text-color: #4a4a4a;
            --card-bg: #ffffff;
            --tag-bg: #ffb6c1;
            --btn-bg: #ff1493;
            --btn-hover: #c71585;
            --border-color: #e6a8c7;
        }

        /* CSS Variabel untuk Tema Malam (Dark) */
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --header-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --card-bg: #242424;
            --tag-bg: #4a4a4a;
            --btn-bg: #ff1493;
            --btn-hover: #c71585;
            --border-color: #444444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            background-color: var(--header-bg);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 10;
            transition: background-color 0.3s;
        }
        header h1 { cursor: pointer; }

        header .top-actions {
            margin-top: 8px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        main {
            width: 100%;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .article-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border-left: 6px solid var(--btn-bg);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: background 0.3s;
        }
        .article-title { color: var(--btn-bg); margin-bottom: 10px; font-size: 1.5rem; }
        
        .tags-container { margin-bottom: 15px; }
        .tag {
            display: inline-block; background-color: var(--tag-bg); color: #fff;
            padding: 4px 10px; border-radius: 20px; font-size: 0.8rem;
            margin-right: 5px; margin-bottom: 5px; font-weight: bold; text-transform: lowercase;
        }
        .article-content p {
            margin-bottom: 15px;
            line-height: 1.8;
        }
        .article-content h3 {
            color: var(--btn-bg);
            margin-top: 25px;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        .article-content ul {
            margin-bottom: 15px;
            margin-left: 20px;
        }
        .article-content li {
            margin-bottom: 8px;
        }

        .article-image {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .video-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        .article-desc {
            font-style: italic; opacity: 0.8; margin-bottom: 15px;
            border-bottom: 1px dashed var(--tag-bg); padding-bottom: 10px;
        }
        .article-content { margin-bottom: 20px; }

        .btn {
            display: inline-block; background-color: var(--btn-bg); color: white;
            text-decoration: none; padding: 10px 20px; border-radius: 6px;
            font-weight: bold; transition: background-color 0.3s; cursor: pointer; border: none;
        }
        .btn:hover { background-color: var(--btn-hover); }
        .btn-back { background-color: #ccc; color: #333; margin-top: 20px; }
        .btn-back:hover { background-color: #999; }

        /* Tombol Mode Siang/Malam */
        .theme-toggle-btn {
            background: #fff;
            color: var(--btn-bg);
            font-weight: 700;
            border: 2px solid rgba(255,20,147,0.12);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .theme-toggle-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <h1 onclick="window.location.hash=''">Teknologi Blog</h1>
        <p>Kumpulan Artikel Menarik Favorit Anda</p>
        <div class="top-actions">
            <button id="themeToggleBtn" class="theme-toggle-btn" title="Ganti Mode Siang/Malam">🌙 Malam</button>
        </div>
    </header>

    <main id="app"></main>

    <script>
        // Data statis artikel blog
        let articles = [
            {
                title: "Kucing: Peliharaan Lucu Penawar Stres",
                slug: "kucing-peliharaan-lucu",
                tags: ["Kucing", "Hewan Peliharaan", "Kesehatan Mental"],
                image: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80",
                description: "Mengenal lebih dekat tingkah laku kucing dan manfaat memeliharanya untuk kesehatan mental kita sehari-hari.",
                content: '<h2>Pesona Kucing: Sahabat Berbulu yang Memikat Hati Manusia</h2>\n<p>Kucing telah lama menjadi salah satu hewan peliharaan paling populer di seluruh dunia. Dengan langkahnya yang senyap, mata yang tajam, dan tingkah laku yang menggemaskan, hewan dari keluarga <i>feline</i> ini berhasil merebut tempat istimewa di hati jutaan orang.</p>\n<hr>\n<h3>Karakteristik dan Sifat Alami</h3>\n<p>Sebagai hewan karnivora obligat, kucing memiliki insting berburu yang sangat kuat. Meskipun sebagian besar kucing modern kini hidup nyaman di dalam rumah, naluri seperti mengintai, menerkam, dan memanjat tetap melekat pada diri mereka.</p>\n<p>Selain itu, kucing dikenal sebagai hewan yang sangat mandiri namun tetap penyayang. Mereka memiliki cara komunikasi yang unik untuk berinteraksi dengan manusia, mulai dari mengeong, mendengkur (<i>purring</i>), hingga menggesekkan tubuhnya sebagai tanda kasih sayang atau kepemilikan wilayah.</p>\n<hr>\n<h3>Manfaat Memelihara Kucing</h3>\n<p>Kehadiran kucing di rumah tidak hanya berfungsi sebagai teman bermain, tetapi juga membawa berbagai manfaat positif bagi kesehatan mental dan fisik pemiliknya:</p>\n<ul>\n  <li><b>Peredam Stres:</b> Suara dengkuran kucing terbukti memiliki frekuensi terapeutik yang dapat menenangkan sistem saraf, menurunkan tekanan darah, dan mengurangi kecemasan.</li>\n  <li><b>Menjaga Lingkungan:</b> Naluri pemburu alami membuat kucing sangat efektif dalam mengendalikan populasi hama kecil seperti tikus di sekitar rumah.</li>\n  <li><b>Melatih Tanggung Jawab:</b> Merawat kucing mengajarkan kedisiplinan dan empati, menjadikannya hewan peliharaan yang sangat baik untuk keluarga dan anak-anak.</li>\n</ul>\n<hr>\n<h3>Tips Perawatan Dasar</h3>\n<p>Agar kucing tetap sehat dan bahagia, ada beberapa kebutuhan utama yang harus dipenuhi oleh pemilik:</p>\n<ol>\n  <li><b>Nutrisi Seimbang:</b> Berikan makanan khusus kucing yang sesuai dengan usia dan kebutuhan gizinya, serta pastikan air bersih selalu tersedia.</li>\n  <li><b>Kebersihan:</b> Sediakan kotak pasir (<i>litter box</i>) yang bersih dan rutin menyisir bulu mereka untuk mencegah bola rambut (<i>hairball</i>).</li>\n  <li><b>Kesehatan Rutin:</b> Lakukan vaksinasi berkala dan pemeriksaan kesehatan ke dokter hewan guna mencegah penyakit berbahaya.</li>\n</ol>\n<hr>\n<blockquote>\n  Kucing bukan sekadar hewan peliharaan, melainkan anggota keluarga yang membawa kehangatan, hiburan, dan ketenangan di setiap rumah tempat mereka tinggal.\n</blockquote>'
            },
            {
                title: "Pesona Anggun Baju Abaya Modern",
                slug: "pesona-baju-abaya",
                tags: ["Baju Abaya", "Fashion Muslim", "Gaya Hidup"],
                image: "https://images.unsplash.com/photo-1589405858862-2ac9cbf41369?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80",
                description: "Perkembangan baju abaya dari pakaian tradisional menjadi tren fashion muslimah modern yang elegan.",
                content: "<p>Baju abaya telah berevolusi dari sekadar pakaian tradisional di Timur Tengah menjadi salah satu ikon fashion muslimah global. Identik dengan potongannya yang longgar dan menjuntai hingga ke mata kaki, abaya kini hadir dengan berbagai desain, bordir, dan palet warna yang menarik tanpa menghilangkan nilai syar'i-nya.</p>"
            },
            {
                title: "Mengapa Sapi Menghabiskan Waktunya Makan Rumput?",
                slug: "sapi-makan-rumput",
                tags: ["Sapi", "Alam", "Sains Ternak"],
                video: "https://www.youtube.com/embed/gHk_97qUurE",
                description: "Fakta ilmiah di balik perilaku sapi yang selalu terlihat mengunyah rumput sepanjang hari.",
                content: "<p>Jika Anda melihat sapi di padang rumput, Anda hampir pasti melihat mereka sedang makan. Sapi adalah hewan herbivora rumaninsia (pemamah biak) yang memiliki sistem pencernaan unik dengan lambung empat ruang. Karena rumput mengandung selulosa yang sulit dicerna, sapi menelan rumput secara kasar, menyimpannya di lambung pertama (rumen), lalu mengeluarkannya kembali ke mulut untuk dikunyah ulang saat mereka sedang beristirahat.</p>"
            }
        ];

        const appContainer = document.getElementById('app');
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        // Logika Mode Siang / Malam
        function setTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggleBtn.textContent = '☀️ Siang';
                localStorage.setItem('blog_theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
                themeToggleBtn.textContent = '🌙 Malam';
                localStorage.setItem('blog_theme', 'light');
            }
        }

        // Cek preferensi tema sebelumnya
        const savedTheme = localStorage.getItem('blog_theme') || 'light';
        setTheme(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                setTheme('light');
            } else {
                setTheme('dark');
            }
        });

        function renderTags(tags) {
            return tags.map(tag => `<span class="tag">#${escapeHtml(tag)}</span>`).join('');
        }

        function escapeHtml(str) {
            if (!str && str !== 0) return '';
            return String(str).replace(/[&<>"']/g, function(m) {
                return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];
            });
        }

        function renderMedia(article) {
            if (article.video) {
                if (article.video.endsWith('.mp4') || article.video.endsWith('.webm')) {
                    const src = escapeHtml(article.video);
                    return `
                    <video controls style="width: 100%; max-height: 400px; border-radius: 8px; margin-bottom: 15px; background-color: black;">
                        <source src="${src}" type="video/mp4">
                        Maaf, browser Anda tidak mendukung pemutar video.
                    </video>`;
                } else {
                    const src = escapeHtml(article.video);
                    return `
                    <div class="video-container">
                        <iframe src="${src}" allowfullscreen></iframe>
                    </div>`;
                }
            } else if (article.image) {
                const src = escapeHtml(article.image);
                const alt = escapeHtml(article.title || '');
                return `<img src="${src}" alt="${alt}" class="article-image">`;
            }
            return '';
        }

        function renderHome() {
            let html = '';
            articles.forEach(article => {
                html += `
                    <article class="article-card">
                        <h2 class="article-title">${escapeHtml(article.title)}</h2>
                        ${renderMedia(article)}
                        <div class="tags-container">
                            ${renderTags(article.tags || [])}
                        </div>
                        <p class="article-desc">${escapeHtml(article.description)}</p>
                        <a href="#${encodeURIComponent(article.slug)}" class="btn">Baca Selengkapnya &raquo;</a>
                    </article>
                `;
            });
            appContainer.innerHTML = html;
        }

        function renderArticle(slug) {
            const article = articles.find(a => a.slug === slug);
            if (article) {
                appContainer.innerHTML = `
                    <article class="article-card">
                        <h2 class="article-title">${escapeHtml(article.title)}</h2>
                        ${renderMedia(article)}
                        <div class="tags-container">
                            ${renderTags(article.tags || [])}
                        </div>
                        <p class="article-desc">${escapeHtml(article.description)}</p>
                        <div class="article-content">
                            ${article.content}
                        </div>
                        <a href="#" class="btn btn-back">&laquo; Kembali ke Beranda</a>
                    </article>
                `;
            } else {
                appContainer.innerHTML = `
                    <article class="article-card" style="text-align: center;">
                        <h2 class="article-title">Artikel Tidak Ditemukan</h2>
                        <a href="#" class="btn">&laquo; Kembali ke Beranda</a>
                    </article>
                `;
            }
        }

        function router() {
            const slug = decodeURIComponent(window.location.hash.substring(1)); 
            if (slug) {
                renderArticle(slug);
                window.scrollTo(0,0);
            } else {
                renderHome();
            }
        }

        window.addEventListener('hashchange', router);
        router();
    </script>
</body>
</html>
