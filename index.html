<!DOCTYPE html>
<html hreflang="x-default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teknologi Blog</title>
    <style>
        /* CSS Variabel untuk Tema Pink */
        :root {
            --bg-color: #fff0f5;
            --header-bg: #ff69b4;
            --text-color: #4a4a4a;
            --card-bg: #ffffff;
            --tag-bg: #ffb6c1;
            --btn-bg: #ff1493;
            --btn-hover: #c71585;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--header-bg);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header h1 { cursor: pointer; }

        main {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .article-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border-left: 6px solid var(--header-bg);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .article-title { color: var(--btn-bg); margin-bottom: 10px; font-size: 1.5rem; }
        
        .tags-container { margin-bottom: 15px; }
        .tag {
            display: inline-block; background-color: var(--tag-bg); color: #fff;
            padding: 4px 10px; border-radius: 20px; font-size: 0.8rem;
            margin-right: 5px; margin-bottom: 5px; font-weight: bold; text-transform: lowercase;
        }

        /* --- CSS BARU UNTUK GAMBAR DAN VIDEO --- */
        .article-image {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .video-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
        }
        /* -------------------------------------- */

        .article-desc {
            font-style: italic; color: #666; margin-bottom: 15px;
            border-bottom: 1px dashed var(--tag-bg); padding-bottom: 10px;
        }
        .article-content { margin-bottom: 20px; }

        .btn {
            display: inline-block; background-color: var(--btn-bg); color: white;
            text-decoration: none; padding: 10px 20px; border-radius: 6px;
            font-weight: bold; transition: background-color 0.3s; cursor: pointer; border: none;
        }
        .btn:hover { background-color: var(--btn-hover); }
        .btn-back { background-color: #ccc; color: #333; margin-top: 20px; }
        .btn-back:hover { background-color: #999; }
    </style>
</head>
<body>

    <header>
        <h1 onclick="window.location.hash=''">Teknologi Blog</h1>
        <p>Kumpulan Artikel Menarik Favorit Anda</p>
    </header>

    <main id="app"></main>

    <script>
        // Menambahkan properti "image" atau "video" ke dalam artikel
        const articles = [
            {
                title: "Kucing: Peliharaan Lucu Penawar Stres",
                slug: "kucing-peliharaan-lucu",
                tags: ["Kucing", "Hewan Peliharaan", "Kesehatan Mental"],
                image: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80",
                description: "Mengenal lebih dekat tingkah laku kucing dan manfaat memeliharanya untuk kesehatan mental kita sehari-hari.",
                content: "Kucing adalah salah satu hewan peliharaan paling populer di dunia. Tingkah mereka yang menggemaskan, dari mengejar bola benang hingga tidur di tempat-tempat sempit, selalu berhasil membuat pemiliknya tersenyum. Namun lebih dari sekadar lucu, penelitian menunjukkan bahwa dengkuran kucing (purring) berada pada frekuensi yang dapat menurunkan tekanan darah dan meredakan stres."
            },
            {
                title: "Pesona Anggun Baju Abaya Modern",
                slug: "pesona-baju-abaya",
                tags: ["Baju Abaya", "Fashion Muslim", "Gaya Hidup"],
                image: "https://images.unsplash.com/photo-1589405858862-2ac9cbf41369?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80",
                description: "Perkembangan baju abaya dari pakaian tradisional menjadi tren fashion muslimah modern yang elegan.",
                content: "Baju abaya telah berevolusi dari sekadar pakaian tradisional di Timur Tengah menjadi salah satu ikon fashion muslimah global. Identik dengan potongannya yang longgar dan menjuntai hingga ke mata kaki, abaya kini hadir dengan berbagai desain, bordir, dan palet warna yang menarik tanpa menghilangkan nilai syar'i-nya."
            },
            {
                title: "Mengapa Sapi Menghabiskan Waktunya Makan Rumput?",
                slug: "sapi-makan-rumput",
                tags: ["Sapi", "Alam", "Sains Ternak"],
                // Menggunakan ID Video YouTube untuk disisipkan
                video: "https://www.youtube.com/embed/gHk_97qUurE",
                description: "Fakta ilmiah di balik perilaku sapi yang selalu terlihat mengunyah rumput sepanjang hari.",
                content: "Jika Anda melihat sapi di padang rumput, Anda hampir pasti melihat mereka sedang makan. Sapi adalah hewan herbivora rumaninsia (pemamah biak) yang memiliki sistem pencernaan unik dengan lambung empat ruang. Karena rumput mengandung selulosa yang sulit dicerna, sapi menelan rumput secara kasar, menyimpannya di lambung pertama (rumen), lalu mengeluarkannya kembali ke mulut untuk dikunyah ulang saat mereka sedang beristirahat."
            }
        ];

        const appContainer = document.getElementById('app');

        function renderTags(tags) {
            return tags.map(tag => `<span class="tag">#${tag}</span>`).join('');
        }

        // Fungsi pembantu untuk merender gambar atau video jika ada
        function renderMedia(article) {
            if (article.video) {
                return `
                <div class="video-container">
                    <iframe src="${article.video}" allowfullscreen></iframe>
                </div>`;
            } else if (article.image) {
                return `<img src="${article.image}" alt="${article.title}" class="article-image">`;
            }
            return ''; // Kosong jika tidak ada gambar/video
        }

        function renderHome() {
            let html = '';
            articles.forEach(article => {
                html += `
                    <article class="article-card">
                        <h2 class="article-title">${article.title}</h2>
                        ${renderMedia(article)}
                        <div class="tags-container">
                            ${renderTags(article.tags)}
                        </div>
                        <p class="article-desc">${article.description}</p>
                        <a href="#${article.slug}" class="btn">Baca Selengkapnya &raquo;</a>
                    </article>
                `;
            });
            appContainer.innerHTML = html;
        }

        function renderArticle(slug) {
            const article = articles.find(a => a.slug === slug);
            if (article) {
                appContainer.innerHTML = `
                    <article class="article-card">
                        <h2 class="article-title">${article.title}</h2>
                        ${renderMedia(article)}
                        <div class="tags-container">
                            ${renderTags(article.tags)}
                        </div>
                        <p class="article-desc">${article.description}</p>
                        <div class="article-content">
                            <p>${article.content}</p>
                        </div>
                        <a href="#" class="btn btn-back">&laquo; Kembali ke Beranda</a>
                    </article>
                `;
            } else {
                appContainer.innerHTML = `
                    <article class="article-card" style="text-align: center;">
                        <h2 class="article-title">Artikel Tidak Ditemukan</h2>
                        <a href="#" class="btn">&laquo; Kembali ke Beranda</a>
                    </article>
                `;
            }
        }

        function router() {
            const slug = window.location.hash.substring(1); 
            if (slug) {
                renderArticle(slug);
                window.scrollTo(0,0);
            } else {
                renderHome();
            }
        }

        window.addEventListener('hashchange', router);
        router();
    </script>
</body>
</html>
